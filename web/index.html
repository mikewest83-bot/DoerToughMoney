<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#12A150" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DoerToughMoney" />
    <meta name="description" content="DoerToughMoney helps you know what you can afford, find ways to save, and negotiate smarter deals." />
    <meta property="og:title" content="DoerToughMoney — Keep More. Spend Smarter." />
    <meta property="og:description" content="Know what you can afford. Know what you should pay. Keep more of your money." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>DoerToughMoney — Keep More. Spend Smarter.</title>
    <style>
      /* Launch conversion layer: make the first financial card communicate the
         product promise before the user starts exploring the dashboard. */
      [style*="linear-gradient(135deg, #16151A 0%, #25232A 100%)"] {
        position: relative !important;
        overflow: hidden !important;
        padding-top: 86px !important;
        box-shadow: 0 18px 42px rgba(22,21,26,.16) !important;
      }
      [style*="linear-gradient(135deg, #16151A 0%, #25232A 100%)"]::before {
        content: "KEEP MORE. SPEND SMARTER.";
        position: absolute;
        top: 22px;
        left: 26px;
        right: 26px;
        color: #ffffff;
        font: 800 22px/1.05 Inter, system-ui, sans-serif;
        letter-spacing: -.045em;
      }
      [style*="linear-gradient(135deg, #16151A 0%, #25232A 100%)"]::after {
        content: "Know what you can afford. Know what you should pay.";
        position: absolute;
        top: 50px;
        left: 26px;
        right: 26px;
        color: #B9B9C6;
        font: 500 12px/1.35 Inter, system-ui, sans-serif;
      }
      [style*="linear-gradient(135deg, #16151A 0%, #25232A 100%)"] > span:first-child {
        display: none !important;
      }
      @media (max-width: 600px) {
        [style*="linear-gradient(135deg, #16151A 0%, #25232A 100%)"] {
          padding: 82px 20px 20px !important;
          border-radius: 22px !important;
        }
        [style*="linear-gradient(135deg, #16151A 0%, #25232A 100%)"]::before {
          left: 20px;
          right: 20px;
          top: 20px;
          font-size: 20px;
        }
        [style*="linear-gradient(135deg, #16151A 0%, #25232A 100%)"]::after {
          left: 20px;
          right: 20px;
          top: 48px;
          font-size: 11.5px;
        }
      }
    </style>
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
