    <!-- The app is reachable at both doertoughmoney.com and its Railway host,
         and every client route is served by the same index.html. Without a
         canonical those register as duplicates of one another. -->
    <link rel="canonical" href="https://doertoughmoney.com/" />
    <script>
      // Point the canonical at this page's own path on the primary domain.
      // Static value above is correct for "/" so a crawler that runs no
      // JavaScript still gets a sane answer on the page that matters most.
      (function () {
        var link = document.querySelector('link[rel="canonical"]');
        if (!link) return;
        var path = location.pathname.replace(/\/{2,}/g, "/").replace(/\/$/, "");
        link.href = "https://doertoughmoney.com" + (path || "/");
      })();
    </script>
